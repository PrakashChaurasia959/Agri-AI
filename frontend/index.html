<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgriVision AI - crop disease detection, crop recommendation, yield estimation and farm weather intelligence powered by deep learning."
    />
    <meta name="theme-color" content="#4ba148" />
    <title>AgriVision AI - Smart Agriculture Intelligence</title>
    <script>
      // Apply the stored theme before React mounts so there is no flash of
      // the wrong colour scheme.
      (function () {
        try {
          var stored = localStorage.getItem('agrivision-theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          if (dark) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage unavailable - fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AgriVision AI requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
